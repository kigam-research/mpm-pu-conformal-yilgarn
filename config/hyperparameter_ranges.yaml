# Hyperparameter Ranges for Optuna Optimization

# XGBoost hyperparameter ranges
xgboost:
  n_estimators:
    type: "int"
    low: 100
    high: 500

  max_depth:
    type: "int"
    low: 3
    high: 8

  learning_rate:
    type: "float"
    low: 0.01
    high: 0.3
    log: true

  min_child_weight:
    type: "int"
    low: 1
    high: 10

  gamma:
    type: "float"
    low: 0.0
    high: 0.5

  reg_alpha:
    type: "float"
    low: 1.0e-8
    high: 10.0
    log: true

  reg_lambda:
    type: "float"
    low: 1.0e-8
    high: 10.0
    log: true

  # Fixed parameters
  fixed:
    objective: "binary:logistic"
    eval_metric: "logloss"
    use_label_encoder: false
    random_state: 42
    n_jobs: 1
    verbosity: 0
    subsample: 1.0
    colsample_bytree: 1.0
    device: "cpu"

# BaggingPU hyperparameter ranges
baggingpu:
  n_estimators:
    type: "int"
    low: 10
    high: 30

  max_samples:
    type: "float"
    low: 0.3
    high: 0.7

  # Fixed parameters
  fixed:
    bootstrap: false
    random_state: 42
    n_jobs: 1

# BaggingPU(XGBoost) combined ranges
baggingpu_xgboost:
  bagging:
    n_estimators:
      type: "int"
      low: 10
      high: 30
    max_samples:
      type: "float"
      low: 0.3
      high: 0.7

# BaggingPU grid search parameter space
baggingpu_gridsearch:
  max_samples:
    values: [0.1, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
  n_estimators:
    values: [10, 20, 30, 40, 50]

# Default values
defaults:
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    min_child_weight: 3
    gamma: 0.1
    reg_alpha: 0.01
    reg_lambda: 0.01
    subsample: 1.0
    colsample_bytree: 1.0

  baggingpu_xgboost:
    bagging:
      n_estimators: 15
      max_samples: 0.5
